<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Check Admission | MGGS</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
</head>
<body class="bg-gray-50 text-gray-800">
  <div class="bg-blue-900 text-white text-sm py-2 px-4">
    <div class="max-w-6xl mx-auto flex justify-between">
      <span>7742936593</span>
      <a href="login.html" class="hover:text-yellow-300">Staff Login</a>
    </div>
  </div>
  <nav class="bg-white shadow-md py-3 px-4">
    <div class="max-w-6xl mx-auto flex justify-between items-center">
      <a href="index.html" class="font-bold text-blue-900">MGGS Lalchandpura</a>
      <a href="admission.html" class="text-sm text-blue-600">← Back to Form</a>
    </div>
  </nav>

  <main class="max-w-xl mx-auto px-4 py-12">
    <div class="bg-white rounded-2xl shadow border p-6">
      <h1 class="text-xl font-bold text-blue-900 mb-4">Check Admission Status</h1>
      <div class="flex gap-2 mb-6">
        <input type="text" id="searchId" placeholder="Enter Application ID (e.g. APP12345678)" class="flex-1 border rounded-lg px-3 py-2 outline-none focus:ring-2 focus:ring-blue-500" />
        <button onclick="checkStatus()" class="bg-blue-700 text-white px-4 py-2 rounded-lg hover:bg-blue-800">Search</button>
      </div>
      <div id="result" class="hidden"></div>
    </div>
  </main>

  <script>
    function checkStatus() {
      const id = document.getElementById('searchId').value.trim().toUpperCase();
      const list = JSON.parse(localStorage.getItem('mggs_admissions') || '[]');
      const found = list.find(a => a.id === id);
      const box = document.getElementById('result');
      box.classList.remove('hidden');
      if (!found) {
        box.innerHTML = `<div class="p-4 bg-red-50 border border-red-200 rounded-xl text-red-700">No application found with this ID.</div>`;
        return;
      }
      box.innerHTML = `
        <div class="p-4 bg-green-50 border border-green-200 rounded-xl space-y-2 text-sm">
          <p><strong>Application ID:</strong> ${found.id}</p>
          <p><strong>Student:</strong> ${found.studentName}</p>
          <p><strong>Class:</strong> ${found.class}</p>
          <p><strong>Parent Mobile:</strong> ${found.parentMobile}</p>
          <p><strong>Status:</strong> <span class="font-semibold text-orange-600">${found.status}</span></p>
          <p><strong>Submitted:</strong> ${found.submittedAt}</p>
        </div>`;
    }
  </script>
</body>
</html>
