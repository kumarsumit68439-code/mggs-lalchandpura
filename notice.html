<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Notice Board | MGGS Lalchandpura</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
</head>
<body class="bg-gray-50 text-gray-800">
  <div class="bg-blue-900 text-white text-sm py-2 px-4">
    <div class="max-w-6xl mx-auto flex justify-between">
      <span>7742936593</span>
      <a href="login.html" class="hover:text-yellow-300">Staff Login</a>
    </div>
  </div>
  <nav class="bg-white shadow-md sticky top-0 z-50">
    <div class="max-w-6xl mx-auto px-4 flex justify-between items-center py-3">
      <a href="index.html" class="font-bold text-blue-900">MGGS Lalchandpura</a>
      <div class="hidden md:flex gap-5 text-sm font-medium">
        <a href="index.html" class="hover:text-blue-700">Home</a>
        <a href="about.html" class="hover:text-blue-700">About</a>
        <a href="admission.html" class="hover:text-blue-700">Admission</a>
        <a href="notice.html" class="text-blue-800 border-b-2 border-yellow-400">Notice</a>
        <a href="gallery.html" class="hover:text-blue-700">Gallery</a>
        <a href="contact.html" class="hover:text-blue-700">Contact</a>
      </div>
    </div>
  </nav>

  <div class="bg-blue-800 text-white py-10 px-4">
    <div class="max-w-6xl mx-auto">
      <h1 class="text-3xl font-bold">Notice Board</h1>
      <p class="text-blue-200 mt-1">School notices and announcements</p>
    </div>
  </div>

  <main class="max-w-4xl mx-auto px-4 py-10">
    <div id="noticeList" class="space-y-4"></div>
  </main>

  <footer class="bg-gray-900 text-gray-400 py-6 text-center text-sm">© 2026 MGGS Lalchandpura</footer>

  <script>
    function loadNotices() {
      const notices = JSON.parse(localStorage.getItem('mggs_notices') || '[]');
      const box = document.getElementById('noticeList');
      if (notices.length === 0) {
        box.innerHTML = `<div class="bg-white border border-dashed rounded-xl p-8 text-center text-gray-500">
          <i class="fas fa-bullhorn text-3xl mb-3 text-gray-300"></i>
          <p>No notices published yet.</p>
          <p class="text-sm mt-1">Teachers / Principal can add notices from the dashboard.</p>
        </div>`;
        return;
      }
      box.innerHTML = notices.map(n => `
        <div class="bg-white rounded-xl border shadow-sm p-5">
          <div class="flex justify-between items-start gap-4">
            <div>
              <span class="text-xs font-medium text-blue-600 bg-blue-50 px-2 py-0.5 rounded">${n.date || ''}</span>
              <h3 class="font-bold text-lg text-gray-800 mt-2">${n.title}</h3>
              <p class="text-gray-600 mt-2 whitespace-pre-wrap">${n.content}</p>
            </div>
          </div>
        </div>
      `).join('');
    }
    loadNotices();
  </script>
</body>
</html>
